[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	Wire
	adafruit/Adafruit HMC5883 Unified@^1.2.4
	adafruit/Adafruit Unified Sensor@^1.1.15
	olikraus/U8g2@^2.36.18
